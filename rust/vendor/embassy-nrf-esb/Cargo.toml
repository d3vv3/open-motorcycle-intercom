[workspace]

[package]
name = "embassy-nrf-esb"
version = "0.1.0"
edition = "2024"
publish = false
description = "Scoped, unqualified ESB source fork for OpenHelmet"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Raymond8196/embassy-nrf-esb"

[dependencies]
embassy-nrf = { version = "=0.10.0", features = ["unstable-pac"] }
embassy-sync = "0.8"
embassy-time = { version = "=0.5.1", default-features = false }
cortex-m = { version = "0.7", default-features = false }
defmt = { version = "0.3", optional = true }

[features]
default = ["nrf52840"]
nrf52840 = ["embassy-nrf/nrf52840"]
nrf52833 = ["embassy-nrf/nrf52833"]
nrf52832 = ["embassy-nrf/nrf52832"]
fast-ru = []
rx-blocking-trace = []
defmt = ["dep:defmt", "embassy-nrf/defmt"]
_cs-cortex = ["cortex-m/critical-section-single-core"]
# Reserved only so imported cfg gates remain explicit. Not supported by this fork.
mpsl = []

[target.'cfg(not(target_arch = "arm"))'.dev-dependencies]
critical-section = { version = "1", features = ["std"] }
