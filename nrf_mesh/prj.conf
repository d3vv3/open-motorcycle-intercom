# OMI Mesh Firmware - Zephyr Configuration
# Target: Seeed XIAO nRF52840

# Enable ESB (Enhanced ShockBurst)
CONFIG_ESB=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# SPI for bridge to ESP32-S3
CONFIG_SPI=y
CONFIG_SPI_NRFX=y

# UART still needed for USB CDC console
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Timers
CONFIG_COUNTER=y
CONFIG_NRFX_TIMER0=y

# System
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y

# Console on USB CDC ACM
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# USB CDC ACM Console
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="OMI Mesh Node"
CONFIG_USB_DEVICE_PID=0x0001
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n


# GPIO
CONFIG_GPIO=y

# Disable unused features to save space
CONFIG_BT=n

# Treat warnings as warnings, not errors (for development)
CONFIG_WARN_DEPRECATED=n
