# OMI Mesh Firmware - Zephyr Configuration
# Target: Seeed XIAO nRF52840

# Clock Configuration - Use 32.768 kHz Crystal for low drift (~20 ppm)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=n
# RC calibration not needed with crystal
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
# CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_LF_ALWAYS_ON=y
# CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_PERIOD=1000

# Enable ESB (Enhanced ShockBurst)
CONFIG_ESB=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=252

# SPI for bridge to ESP32-S3
CONFIG_SPI=y
CONFIG_SPI_NRFX=y

# UART still needed for USB CDC console
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Timers
CONFIG_COUNTER=y
CONFIG_NRFX_TIMER0=y
CONFIG_NRFX_TIMER1=y

# GPIOTE + PPI for I2S WS sync capture
CONFIG_NRFX_GPIOTE0=y
CONFIG_NRFX_PPI=y

# System
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y

# Debug/fault handling
CONFIG_DEBUG=y
CONFIG_DEBUG_INFO=y
CONFIG_EXCEPTION_STACK_TRACE=y
CONFIG_FAULT_DUMP=2
CONFIG_EXTRA_EXCEPTION_INFO=y

# Console on USB CDC ACM
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# USB CDC ACM Console
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="OMI Mesh Node"
CONFIG_USB_DEVICE_PID=0x0001
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=512


# GPIO
CONFIG_GPIO=y

# Disable unused features to save space
CONFIG_BT=n

# Treat warnings as warnings, not errors (for development)
CONFIG_WARN_DEPRECATED=n
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
